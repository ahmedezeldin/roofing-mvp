{% extends "website.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block content %}
<div class="login-page-shell login-page-shell-single">
  <section class="login-main-card">
    <div class="login-kicker">Recovery</div>
    <h1 class="login-title">Create a new password</h1>
    <p class="login-subtitle">Use a strong password you haven’t used before.</p>

    <form action="/reset-password" method="post" class="login-form">
      {% if error_message %}
      <div class="form-error">{{ error_message }}</div>
      {% endif %}
      <input type="hidden" name="token" value="{{ token }}">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Update password</button>
    </form>
  </section>
</div>
{% endblock %}
