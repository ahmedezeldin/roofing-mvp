{% extends "website.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block content %}
<div class="login-page-shell login-page-shell-single">
  <section class="login-main-card">
    <div class="login-kicker">Recovery</div>
    <h1 class="login-title">Forgot your password?</h1>
    <p class="login-subtitle">Enter your account email and we’ll send you a one-time recovery code.</p>

    <form action="/forgot-password" method="post" class="login-form">
      {% if error_message %}
      <div class="form-error">{{ error_message }}</div>
      {% endif %}
      <div class="form-group">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" value="{{ form_data.email if form_data else '' }}" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Send one-time code</button>
      <div class="login-bottom-note">Remembered it? <a href="/login">Back to login</a></div>
    </form>
  </section>
</div>
{% endblock %}
