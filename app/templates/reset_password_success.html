{% extends "website.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}

{% block content %}
<div class="login-page-shell login-page-shell-single">
  <section class="login-main-card">
    <div class="login-kicker">Done</div>
    <h1 class="login-title">Your password has been changed</h1>
    <p class="login-subtitle">You can now sign in again with your new password.</p>
    <a href="/login" class="btn btn-primary btn-full">Back to login</a>
  </section>
</div>
{% endblock %}
